# nginx sin privilegios (uid 1000, puerto 8080, rootfs de sólo lectura: todo lo
# escribible va a /tmp, un emptyDir). /graphql (HTTP + WSS) se reenvía al
# Service graphql-gateway del MISMO namespace => cada ambiente habla con su API.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /health/ready { default_type application/json; return 200 '{"status":"ok","service":"frontend"}'; }
    location = /health/live { default_type application/json; return 200 '{"status":"ok"}'; }

    location /graphql {
      proxy_pass http://graphql-gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location = /config.json { add_header Cache-Control "no-store"; }
    location / { try_files $uri /index.html; }
  }
}
